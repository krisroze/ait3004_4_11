services:
  mysql_db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: bank_system
      MYSQL_USER: bank_user
      MYSQL_PASSWORD: bank_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql_db
      PMA_USER: root
      PMA_PASSWORD: root_password
    depends_on:
      - mysql_db

  qdrant_db:
    image: qdrant/qdrant
    container_name: qdrant_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  backend_api:
    build: ./backend
    container_name: backend_api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - deepface_models:/root/.deepface
    environment:
      - MYSQL_HOST=mysql_db
      - MYSQL_USER=bank_user
      - MYSQL_PASSWORD=bank_password
      - MYSQL_DB=bank_system
      - QDRANT_HOST=qdrant_db
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - mysql_db
      - qdrant_db
      - minio

  frontend_app:
    build: ./frontend
    container_name: frontend_app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend_api

volumes:
  mysql_data:
  qdrant_data:
  minio_data:
  deepface_models: